apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        # correlation_id is structured metadata; link it to a search across both services.
        # `$$` escapes Grafana's provisioning-time env var expansion.
        - name: Correlation
          matcherType: label
          matcherRegex: correlation_id
          datasourceUid: loki
          url: '{service_name=~"api|worker"} | correlation_id="$${__value.raw}"'
          urlDisplayLabel: All logs for this correlation id
