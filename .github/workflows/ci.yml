name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderflow
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:7.6.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 3
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore OrderFlow.sln

      - name: Build
        run: dotnet build OrderFlow.sln --configuration Release --no-restore

      - name: Test
        env:
          ORDERFLOW_TEST_POSTGRES: "Host=localhost;Port=5432;Database=orderflow_test;Username=postgres;Password=postgres"
          ORDERFLOW_TEST_REDIS: "localhost:6379"
          ORDERFLOW_TEST_KAFKA: "localhost:9092"
        run: >
          dotnet test OrderFlow.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  observability-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Image tags match docker-compose.yml so CI validates what the stack actually runs.
      - name: Prometheus config and alert rules
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

      - name: Loki config
        run: >
          docker run --rm
          -v "$PWD/observability/loki/loki.yml:/etc/loki/loki.yml:ro"
          grafana/loki:3.5.3
          -config.file=/etc/loki/loki.yml -verify-config

      - name: Alloy config
        run: >
          docker run --rm
          -v "$PWD/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.10.2
          fmt /etc/alloy/config.alloy

      - name: Grafana dashboards are valid JSON
        run: for f in observability/grafana/dashboards/*.json; do jq empty "$f"; done